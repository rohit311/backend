#salesforce-subscribe-config.client-id=${SALESFORCE_OAUTH_CLIENT_ID:3MVG9n_HvETGhr3BpwSbd3TDjwP6dQN.mXf0g_QUPYY6kRal_aRWA1r3dvmzptRFdeEiaiFNP_FBB6p9MzATX}
#salesforce-subscribe-config.client-secret=${SALESFORCE_CLIENT_SECRET:9EDF01A95D9AB351F7D0C236A4AEB57643741BFFEB8729EDB90C3A8552B2227A}
#salesforce-subscribe-config.event-listening-on=${EVENT_LISTENING_ON:true}
salesforce-subscribe-config.active-events=${ACTIVE_EVENTS:/data/AccountChangeEvent}

# JWT Configuration (recommended)
salesforce.jwt.client-id=${SALESFORCE_CLIENT_ID:<client-id>}
salesforce.jwt.username=${SALESFORCE_USERNAME:<user-name>}
salesforce.jwt.login-url=https://login.salesforce.com
salesforce.jwt.private-key-path=classpath:private-key.txt

# Pub/Sub Configuration
pubsub.grpc.host=api.pubsub.salesforce.com
pubsub.grpc.port=7443
pubsub.grpc.shutdown-timeout-seconds=30
pubsub.grpc.channel-idle-timeout-minutes=30

pubsub.event-processing.thread-pool-size=10
pubsub.event-processing.batch-size=5
pubsub.event-processing.channel-health-check-interval-ms=3600000

pubsub.schema.cache-ttl-minutes=60
pubsub.schema.cache-cleanup-interval-ms=300000
